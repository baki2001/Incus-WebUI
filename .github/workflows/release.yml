name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, like v0.1.0"
        required: true

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/incus-webui-linux-$arch .
          done
          cd dist && sha256sum incus-webui-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* install/incus-instance.sh install/host-updates.sh --clobber
            exit 0
          fi
          gh release create "$VERSION" dist/* install/incus-instance.sh install/host-updates.sh \
            --title "$VERSION" --generate-notes --target "$GITHUB_SHA" \
            $([[ "$VERSION" == *-* ]] && echo --prerelease)

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: img
        run: |
          name=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Only real releases move :latest, not prereleases like v1.0.0-rc1.
          tags=$name:$VERSION
          [[ "$VERSION" == *-* ]] || tags="$tags,$name:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.img.outputs.tags }}
